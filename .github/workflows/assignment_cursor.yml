name: PL/SQL Cursor Autograding

on:
push:
paths:
- 'Assignment_Cursor/**'
- '.github/workflows/assignment_cursor.yml'
pull_request:
paths:
- 'Assignment_Cursor/**'
- '.github/workflows/assignment_cursor.yml'
workflow_dispatch:

jobs:
autograding:
runs-on: ubuntu-latest

```
steps:

  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Check Assignment Files
    working-directory: Assignment_Cursor
    run: |
      echo "Checking assignment files..."

      if [ ! -f "answers.sql" ]; then
        echo "ERROR: answers.sql not found"
        exit 1
      fi

      if [ ! -f "test.sh" ]; then
        echo "ERROR: test.sh not found"
        exit 1
      fi

      echo "Required files found."

  - name: Make Test Executable
    working-directory: Assignment_Cursor
    run: chmod +x test.sh

  - name: Run Autograding
    working-directory: Assignment_Cursor
    run: ./test.sh
```
